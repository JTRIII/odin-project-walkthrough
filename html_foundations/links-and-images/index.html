<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Links and Images</title>
    </head>
    <body>
        <h1>Homepage</h1>
        <!-- <a> anchor elements allow us to link to other webpages -->
        <!-- The href (hypertext reference) attribute lets us link the destination we want to go to -->
        <!-- target attribute lets us specify if we want the tab to open in a new window using _blank-->
        <!-- the rel attribute descriges the rlation between the current page and the linked document -->
        <a href="https://www.theodinproject.com/about" target="_blank" rel="noreferrer">About The Odin Project</a>

        <!-- absolute links are links to pages on other websites on the internet -->

        <!-- relative links are links to other pages within our own website -->
        <a href="./pages/about.html">About</a>

        <!-- Images use the <img> void element to put pictures in your web pages-->
        <img src="https://www.theodinproject.com/mstile-310x310.png" alt="The Odin Project Logo" height="310" width="310">
        <img src="./images/dog.jpg" alt="Black Pug in Scarf with Yellow Background" height="400" width="310">

    </body>
</html>
